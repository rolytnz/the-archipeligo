<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Archipeligo
    </title>

    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family: sans-serif;
        }

        #renderCanvas {

            width: 100%;

            height: 100%;

            touch-action: none;
        }

        #controls {

            position: absolute;

            top: 10px;

            left: 10px;

            z-index: 100;

            display: flex;

            flex-direction: column;

            gap: 8px;

            padding: 12px;

            background: rgba(
                0,
                0,
                0,
                0.7
            );

            color: white;

            border-radius: 8px;

            min-width: 220px;
        }

        button,
        select {

            padding: 8px;

            border: none;

            border-radius: 4px;
        }

        button {

            cursor: pointer;
        }

        #stats {

            white-space: pre-line;

            font-size: 0.9rem;
        }

    </style>

</head>

<body>

    <div id="controls">

        <button
            id="generatePlanetButton">

            Generate Planet

        </button>

        <select
            id="renderMode">

        </select>

        <div
            id="stats">

            No planet generated.

        </div>

    </div>

    <canvas
        id="renderCanvas">

    </canvas>

    <script
        type="module"
        src="./src/main.ts">

    </script>

</body>

</html>

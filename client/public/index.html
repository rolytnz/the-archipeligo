<!DOCTYPE html>
<html>
<body>

<h1>The Archipeligo</h1>

<button id="generate">
Generate Planet
</button>

<pre id="output"></pre>

<script>

document
    .getElementById("generate")
    .addEventListener(
        "click",
        async () => {

            const response =
                await fetch(
                    "http://localhost:3000/api/planet",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            name:
                               "Archipeligo Prime"
                        })
                    }
                );

            const data =
                await response.json();

            document
                .getElementById(
                    "output"
                )
                .textContent =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );
        }
    );

</script>

</body>
</html>
